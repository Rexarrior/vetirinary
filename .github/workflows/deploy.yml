name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run tests
        env:
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: '1'
          DB_HOST: localhost
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASSWORD: test_pass
          DB_PORT: '5432'
        run: |
          python manage.py migrate
          python manage.py test

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    environment: ya_cloud_rex
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -eu
            
            echo "📦 Pulling latest code..."
            cd /opt/vetclinic
            PREVIOUS_COMMIT=$(git rev-parse HEAD)
            git fetch origin main
            git reset --hard origin/main

            if docker compose version >/dev/null 2>&1; then
              COMPOSE="docker compose -f docker-compose.prod.yml"
            else
              COMPOSE="docker-compose -f docker-compose.prod.yml"
            fi
            
            echo "🔧 Updating environment..."
            if [ -f .env.prod ]; then
              cp .env.prod .env
            fi

            wait_for_healthy() {
              service="$1"
              container="$2"
              attempts=0

              while [ "$attempts" -lt 24 ]; do
                status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container" 2>/dev/null || true)

                if [ "$status" = "healthy" ]; then
                  echo "✅ $service is healthy"
                  return 0
                fi

                if [ "$status" = "unhealthy" ] || [ "$status" = "exited" ]; then
                  echo "❌ $service entered $status state"
                  $COMPOSE logs --tail=100 "$service" || true
                  return 1
                fi

                attempts=$((attempts + 1))
                sleep 5
              done

              echo "❌ Timed out waiting for $service"
              $COMPOSE logs --tail=100 "$service" || true
              return 1
            }

            verify_release() {
              wait_for_healthy db vetclinic_db || return 1
              wait_for_healthy web vetclinic_web || return 1
              wait_for_healthy nginx vetclinic_nginx || return 1
              $COMPOSE exec -T nginx wget -q -O - http://127.0.0.1/ready/ | grep -q '"status": "ok"' || return 1
            }

            deploy_release() {
              echo "🐳 Building replacement images while the current release keeps running..."
              $COMPOSE build web nginx || return 1

              echo "🚀 Starting the new release and removing obsolete services..."
              $COMPOSE up -d --remove-orphans || return 1

              echo "⏳ Waiting for database, Django and nginx readiness..."
              verify_release || return 1
            }

            rollback_release() {
              echo "↩️ Rolling back to $PREVIOUS_COMMIT..."
              git reset --hard "$PREVIOUS_COMMIT"

              if [ -f .env.prod ]; then
                cp .env.prod .env
              fi

              $COMPOSE build web nginx || return 1
              $COMPOSE up -d --remove-orphans || return 1
              verify_release || return 1
              echo "✅ Previous release restored"
            }

            if deploy_release; then
              echo "🧹 Cleaning up old images..."
              docker image prune -f
              echo "✅ Deployment completed successfully!"
            else
              echo "❌ New release failed readiness checks"
              rollback_release
              exit 1
            fi
            
      - name: Notify on success
        if: success()
        run: echo "🎉 Deployment to production successful!"
        
      - name: Notify on failure
        if: failure()
        run: echo "❌ Deployment failed!"
