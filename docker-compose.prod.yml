services:
  db:
    image: postgres:15-alpine
    container_name: vetclinic_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - vetclinic_network

  web:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    container_name: vetclinic_web
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - DEBUG=0
      - SECRET_KEY=${SECRET_KEY}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - NOOA_CHATBOT_MODEL=${NOOA_CHATBOT_MODEL:-openai/z-ai/glm-4.5-air:free}
      - NOOA_CHATBOT_API_BASE=${NOOA_CHATBOT_API_BASE:-https://openrouter.ai/api/v1}
      - NOOA_CHATBOT_TIMEOUT_SECONDS=${NOOA_CHATBOT_TIMEOUT_SECONDS:-30}
      - NOOA_CHATBOT_TOTAL_TIMEOUT_SECONDS=${NOOA_CHATBOT_TOTAL_TIMEOUT_SECONDS:-45}
      - NOOA_CHATBOT_MAX_CONCURRENT_REQUESTS=${NOOA_CHATBOT_MAX_CONCURRENT_REQUESTS:-2}
      - CHATBOT_RATE_LIMIT_REQUESTS=${CHATBOT_RATE_LIMIT_REQUESTS:-10}
      - CHATBOT_RATE_LIMIT_WINDOW_SECONDS=${CHATBOT_RATE_LIMIT_WINDOW_SECONDS:-60}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/ready/', timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: always
    networks:
      - vetclinic_network

  nginx:
    build:
      context: ./docker/nginx
    container_name: vetclinic_nginx
    volumes:
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - ./docker/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8090:80"
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://127.0.0.1/ready/ | grep -q '\"status\": \"ok\"'" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: always
    networks:
      - vetclinic_network

volumes:
  postgres_data:
  static_volume:
  media_volume:


networks:
  vetclinic_network:
    driver: bridge
